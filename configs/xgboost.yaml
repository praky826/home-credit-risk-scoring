# Default XGBoost configuration and search parameters

params:
  n_estimators: 500
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  reg_alpha: 1.0e-5
  reg_lambda: 1.0e-5
  tree_method: "hist" # Standard fast histogram method on CPU/GPU
  random_state: 42
  eval_metric: "auc"
