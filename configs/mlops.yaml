# Configuration for MLOps layer (MLflow, AWS, Drift parameters)

mlflow:
  tracking_uri: "mlruns"
  experiment_trees: "lendingclub_trees"
  experiment_nn: "lendingclub_nn"
  registry_model_name: "lendingclub_default_risk"

aws:
  region: "us-east-1"
  s3_bucket: "home-credit-mlops"
  s3_model_prefix: "models"
  ecr_repo: "home-credit-serving"
  sns_drift_arn: ""

drift:
  psi_threshold: 0.2
  alert_cooldown_seconds: 3600
  bins: 10
  eps: 1.0e-6
